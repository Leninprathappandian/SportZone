<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Access - SportZone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page-body">
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Sport<span class="highlight">Zone</span></span>
            </a>
            <a href="index.html" class="back-link">← Return to Store</a>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">Sign In</button>
                <button class="tab-btn" id="tabRegister" onclick="switchAuthTab('register')">Create Account</button>
            </div>

            <!-- Status Alerts -->
            <div id="authAlert" class="auth-alert hidden"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-header">
                    <h2>Welcome Athlete</h2>
                    <p>Enter your credentials stored in the database</p>
                </div>
                <div class="form-group">
                    <label for="loginIdentifier">Email or Username</label>
                    <input type="text" id="loginIdentifier" required placeholder="athlete@example.com" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="submit-btn" id="loginSubmitBtn">Sign In</button>
                <div class="demo-hint">
                    <strong>Demo Credential:</strong> <code>demo@sportzone.com</code> / <code>password123</code>
                </div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form hidden">
                <div class="form-header">
                    <h2>Join SportZone</h2>
                    <p>Create an account to track orders and save equipment</p>
                </div>
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" required placeholder="johndoe_athlete" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" required placeholder="you@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required placeholder="At least 6 characters" autocomplete="new-password">
                </div>
                <button type="submit" class="submit-btn" id="registerSubmitBtn">Create Account</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
